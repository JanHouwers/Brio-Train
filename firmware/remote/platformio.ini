; Brio RC Locomotive — handheld remote (transmitter)
; Board: Seeed XIAO ESP32-C5
;
; The C5 is only supported from Arduino-ESP32 core 3.3 / IDF 5.5 onwards, and
; that is not in the official PlatformIO platform espressif32 (still on core
; 2.0.x). Hence the pioarduino fork.
;
; NOTE: requires PlatformIO Core >= 6.1.19. If the `pio` on your PATH is older,
; call the one from the PlatformIO virtualenv instead:
;   %USERPROFILE%\.platformio\penv\Scripts\pio.exe
;
; On Windows, set PYTHONIOENCODING=utf-8 (or run `chcp 65001`) before uploading.
; Without it esptool's progress bar crashes the console with a UnicodeEncodeError
; halfway through the flash.

; ---------------------------------------------------------------------------
; BUILD DIRECTORY AND CLOUD-SYNCED FOLDERS
; If this project lives inside a synced folder (OneDrive, Dropbox, ...), keep the
; build output out of it. The .pio directory PlatformIO creates is several
; hundred MB (firmware.elf 14 MB, firmware.map 13 MB, object files) and would be
; synced in full; worse, the sync client can lock files during compilation and
; then the build already fails while creating .pio with FileNotFoundError.
;
; NOTE: build_dir belongs in [platformio], not in [env:...]. Under the env
; section it is silently ignored and PlatformIO builds in place anyway.
;
; Comment the line out to use the default location.
[platformio]
build_dir = C:/pio-build/remote
; ---------------------------------------------------------------------------

[env:xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; USB-CDC on so that Serial works over the USB-C port (handy for debugging).
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; Verified 2026-07-28, with WiFi.setSleep(false) included:
;   RAM 14.8 % (48,592 of 327,680) · Flash 31.1 % (1,037,887 of 3,342,336)
;   No warnings, not even with -Wall -Wextra.
